name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  kernel:
    name: Rust kernel (fmt, clippy, docs, tests, no_std cross-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --workspace
      - name: Build bnf-core for Cortex-M4F (no_std, no alloc)
        run: cargo build -p bnf-core --release --target thumbv7em-none-eabihf

  simulation:
    name: Attack simulation (${{ matrix.os }})
    needs: kernel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyflakes
      - run: python -m pyflakes simulation
      - run: cargo build --release -p bnf-ffi
      - run: python simulation/run_simulation.py
      - run: python -m unittest discover -s simulation -v
